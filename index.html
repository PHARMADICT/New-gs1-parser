<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <!-- PWA Theme -->
  <meta name="theme-color" content="#0B0E11" />

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Oasis Pharmacy" />

  <title>Oasis Pharmacy – Expiry Tracker</title>

  <!-- Manifest + Icons -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- NOTE: Your current "ZXing Library" links are NOT ZXing and are duplicated.
       Keep them removed unless app.js truly depends on them.
       If your scanner breaks after removing them, tell me what library you intended (zxing-js / html5-qrcode / quagga) and I’ll insert the correct one. -->

  <style>
    :root {
      /* Color System - Refined Industrial */
      --bg-deep: #0a0e14;
      --bg-surface: #0f1419;
      --bg-elevated: #161d26;
      --bg-hover: #1c2530;
      --bg-active: #232d3b;

      --border-subtle: rgba(56, 68, 86, 0.5);
      --border-default: rgba(56, 68, 86, 0.8);
      --border-strong: #384456;

      --text-primary: #e8edf4;
      --text-secondary: #8b9eb3;
      --text-muted: #5d6f84;

      --accent-primary: #3b82f6;
      --accent-primary-hover: #2563eb;
      --accent-glow: rgba(59, 130, 246, 0.2);

      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.12);
      --warning: #f59e0b;
      --warning-bg: rgba(245, 158, 11, 0.12);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
      --info: #6366f1;
      --info-bg: rgba(99, 102, 241, 0.12);

      /* Typography */
      --font-display: 'Outfit', sans-serif;
      --font-mono: 'JetBrains Mono', monospace;

      /* Spacing */
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 16px;
      --space-lg: 24px;
      --space-xl: 32px;
      --space-2xl: 48px;

      /* Borders */
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 16px;
      --radius-full: 9999px;

      /* Transitions */
      --transition-fast: 150ms ease;
      --transition-default: 250ms ease;
      --transition-slow: 400ms ease;

      /* Shadows */
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.5);
      --shadow-glow: 0 0 20px var(--accent-glow);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }

    body {
      font-family: var(--font-display);
      background: var(--bg-deep);
      color: var(--text-primary);
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Scrollbar Styling */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-surface); }
    ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: var(--radius-full); }
    ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* App Container */
    #app {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      max-width: 1600px;
      margin: 0 auto;
    }

    /* Header */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 20, 25, 0.9);
      border-bottom: 1px solid var(--border-subtle);
      padding: var(--space-md) var(--space-lg);
      backdrop-filter: blur(12px);
    }

    .header-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-md);
    }

    .logo { display: flex; align-items: center; gap: var(--space-sm); }
    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--accent-primary), var(--info));
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .logo-text { font-size: 1.25rem; font-weight: 600; letter-spacing: -0.02em; }
    .logo-text span { color: var(--accent-primary); }

    .status-indicators { display: flex; align-items: center; gap: var(--space-md); }
    .status-badge {
      display: flex;
      align-items: center;
      gap: var(--space-xs);
      padding: var(--space-xs) var(--space-sm);
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .status-badge.online { color: var(--success); border-color: var(--success); background: var(--success-bg); }
    .status-badge.offline { color: var(--warning); border-color: var(--warning); background: var(--warning-bg); }

    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    /* Navigation Tabs */
    .nav-tabs {
      display: flex;
      gap: var(--space-xs);
      padding: var(--space-md) var(--space-lg);
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .nav-tab {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-sm) var(--space-md);
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      color: var(--text-secondary);
      font-family: var(--font-display);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition-fast);
      white-space: nowrap;
    }

    .nav-tab:hover { background: var(--bg-hover); color: var(--text-primary); }
    .nav-tab.active { background: var(--bg-elevated); border-color: var(--border-default); color: var(--text-primary); }
    .nav-tab svg { width: 18px; height: 18px; }

    .tab-badge {
      padding: 2px 6px;
      background: var(--accent-primary);
      border-radius: var(--radius-full);
      font-size: 0.625rem;
      font-weight: 600;
      color: white;
    }

    /* Main Content */
    .main-content { flex: 1; padding: var(--space-lg); }
    .tab-panel { display: none; animation: fadeIn var(--transition-default); }
    .tab-panel.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* Cards */
    .card { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); overflow: hidden; }
    .card-header {
      padding: var(--space-md) var(--space-lg);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-md);
    }
    .card-title { font-size: 1rem; font-weight: 600; color: var(--text-primary); }
    .card-body { padding: var(--space-lg); }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
      padding: var(--space-sm) var(--space-md);
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      font-family: var(--font-display);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition-fast);
      white-space: nowrap;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn svg { width: 16px; height: 16px; }

    .btn-primary { background: var(--accent-primary); color: white; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-primary-hover); box-shadow: var(--shadow-glow); }

    .btn-secondary { background: var(--bg-elevated); border-color: var(--border-default); color: var(--text-primary); }
    .btn-secondary:hover:not(:disabled) { background: var(--bg-hover); border-color: var(--border-strong); }

    .btn-ghost { background: transparent; color: var(--text-secondary); }
    .btn-ghost:hover:not(:disabled) { background: var(--bg-hover); color: var(--text-primary); }

    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover:not(:disabled) { background: #dc2626; }

    .btn-lg { padding: var(--space-md) var(--space-lg); font-size: 1rem; }
    .btn-sm { padding: var(--space-xs) var(--space-sm); font-size: 0.75rem; }
    .btn-icon { padding: var(--space-sm); }

    /* Form Elements */
    .form-group { margin-bottom: var(--space-md); }
    .form-label { display: block; margin-bottom: var(--space-xs); font-size: 0.875rem; font-weight: 500; color: var(--text-secondary); }

    .form-input {
      width: 100%;
      padding: var(--space-sm) var(--space-md);
      background: var(--bg-elevated);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      font-family: var(--font-display);
      font-size: 0.875rem;
      color: var(--text-primary);
      transition: all var(--transition-fast);
    }
    .form-input:focus { outline: none; border-color: var(--accent-primary); box-shadow: 0 0 0 3px var(--accent-glow); }
    .form-input::placeholder { color: var(--text-muted); }
    .form-textarea { min-height: 200px; resize: vertical; font-family: var(--font-mono); line-height: 1.6; }

    /* Search Bar */
    .search-bar { position: relative; }
    .search-bar svg {
      position: absolute;
      left: var(--space-md);
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      color: var(--text-muted);
    }
    .search-bar input { padding-left: 44px; }

    /* Filter Chips */
    .filter-chips { display: flex; flex-wrap: wrap; gap: var(--space-sm); }
    .filter-chip {
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      padding: var(--space-xs) var(--space-sm);
      background: var(--bg-elevated);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-full);
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
    }
    .filter-chip:hover { background: var(--bg-hover); color: var(--text-primary); }
    .filter-chip.active { background: var(--accent-primary); border-color: var(--accent-primary); color: white; }
    .filter-chip.danger.active { background: var(--danger); border-color: var(--danger); }
    .filter-chip.warning.active { background: var(--warning); border-color: var(--warning); }

    /* Data Table */
    .table-container {
      overflow: auto;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      background: var(--bg-elevated);
    }
    .data-table { width: 100%; border-collapse: collapse; font-size: 0.8125rem; }
    .data-table th, .data-table td {
      padding: var(--space-sm) var(--space-md);
      text-align: left;
      border-bottom: 1px solid var(--border-subtle);
      white-space: nowrap;
    }
    .data-table th {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg-surface);
      font-weight: 600;
      color: var(--text-secondary);
      user-select: none;
    }
    .data-table th.sortable { cursor: pointer; }
    .data-table th.sortable:hover { color: var(--text-primary); }
    .data-table th.sorted { color: var(--accent-primary); }
    .data-table tbody tr { transition: background var(--transition-fast); }
    .data-table tbody tr:hover { background: var(--bg-hover); }
    .data-table tbody tr:last-child td { border-bottom: none; }
    .data-table .mono { font-family: var(--font-mono); font-size: 0.75rem; }
    .data-table .truncate { max-width: 200px; overflow: hidden; text-overflow: ellipsis; }

    /* Expiry Badges */
    .expiry-badge {
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      padding: 2px var(--space-sm);
      border-radius: var(--radius-full);
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .expiry-badge.expired { background: var(--danger-bg); color: var(--danger); }
    .expiry-badge.soon { background: var(--warning-bg); color: var(--warning); }
    .expiry-badge.ok { background: var(--success-bg); color: var(--success); }
    .expiry-badge.missing { background: var(--bg-active); color: var(--text-muted); }

    /* Match Type Badges */
    .match-badge { display: inline-block; padding: 2px var(--space-sm); border-radius: var(--radius-full); font-size: 0.6875rem; font-weight: 600; }
    .match-badge.exact { background: var(--success-bg); color: var(--success); }
    .match-badge.last8 { background: var(--info-bg); color: var(--info); }
    .match-badge.seq6 { background: var(--warning-bg); color: var(--warning); }
    .match-badge.api { background: rgba(139, 92, 246, 0.12); color: #8b5cf6; }
    .match-badge.none, .match-badge.invalid { background: var(--danger-bg); color: var(--danger); }
    .match-badge.ambiguous { background: var(--warning-bg); color: var(--warning); }

    /* Camera Scanner */
    .scanner-container {
      position: relative;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      aspect-ratio: 4/3;
      background: var(--bg-deep);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .scanner-video { width: 100%; height: 100%; object-fit: cover; }
    .scanner-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.5);
    }
    .scanner-viewfinder {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 70%;
      max-width: 280px;
      aspect-ratio: 3/2;
      border: 2px solid var(--accent-primary);
      border-radius: var(--radius-md);
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6);
    }
    .scanner-viewfinder::before, .scanner-viewfinder::after {
      content: '';
      position: absolute;
      width: 24px;
      height: 24px;
      border: 3px solid var(--accent-primary);
    }
    .scanner-viewfinder::before { top: -3px; left: -3px; border-right: none; border-bottom: none; border-radius: var(--radius-sm) 0 0 0; }
    .scanner-viewfinder::after { bottom: -3px; right: -3px; border-left: none; border-top: none; border-radius: 0 0 var(--radius-sm) 0; }

    .scanner-line {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent-primary), transparent);
      animation: scanLine 2s linear infinite;
    }
    @keyframes scanLine { 0% { top: 0; } 50% { top: calc(100% - 2px); } 100% { top: 0; } }

    .scanner-controls { display: flex; gap: var(--space-md); margin-top: var(--space-lg); justify-content: center; }

    /* File Upload Zone */
    .upload-zone {
      padding: var(--space-2xl);
      border: 2px dashed var(--border-default);
      border-radius: var(--radius-lg);
      text-align: center;
      cursor: pointer;
      transition: all var(--transition-default);
    }
    .upload-zone:hover { border-color: var(--accent-primary); background: var(--accent-glow); }
    .upload-zone.dragover { border-color: var(--accent-primary); background: var(--accent-glow); transform: scale(1.02); }
    .upload-zone-icon { width: 48px; height: 48px; margin: 0 auto var(--space-md); color: var(--text-muted); }
    .upload-zone-text { color: var(--text-secondary); }
    .upload-zone-text strong { color: var(--accent-primary); }

    /* Stats Grid */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: var(--space-md); margin-bottom: var(--space-lg); }
    .stat-card { background: var(--bg-surface); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: var(--space-md); }
    .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--text-primary); font-family: var(--font-mono); }
    .stat-label { font-size: 0.75rem; color: var(--text-muted); margin-top: var(--space-xs); }

    /* Empty State */
    .empty-state { padding: var(--space-2xl); text-align: center; }
    .empty-state-icon { width: 64px; height: 64px; margin: 0 auto var(--space-md); color: var(--text-muted); opacity: 0.5; }
    .empty-state-title { font-size: 1.125rem; font-weight: 600; color: var(--text-primary); margin-bottom: var(--space-sm); }
    .empty-state-text { color: var(--text-secondary); max-width: 400px; margin: 0 auto; }

    /* Toast Notifications */
    .toast-container {
      position: fixed;
      bottom: var(--space-lg);
      right: var(--space-lg);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }
    .toast {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      padding: var(--space-md);
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      animation: slideIn var(--transition-default);
    }
    .toast.success { border-color: var(--success); }
    .toast.error { border-color: var(--danger); }
    .toast.warning { border-color: var(--warning); }
    @keyframes slideIn { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }

    /* Toolbar */
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-md); margin-bottom: var(--space-md); }
    .toolbar-group { display: flex; align-items: center; gap: var(--space-sm); }
    .toolbar-divider { width: 1px; height: 24px; background: var(--border-default); }
    .toolbar .search-bar { flex: 1; min-width: 200px; }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-lg);
      opacity: 0;
      visibility: hidden;
      transition: all var(--transition-default);
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal {
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow: auto;
      background: var(--bg-surface);
      border: 1px solid var(--border-default);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      transform: scale(0.95);
      transition: transform var(--transition-default);
    }
    .modal-overlay.active .modal { transform: scale(1); }
    .modal-header {
      padding: var(--space-lg);
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-title { font-size: 1.125rem; font-weight: 600; }
    .modal-body { padding: var(--space-lg); }
    .modal-footer {
      padding: var(--space-md) var(--space-lg);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      justify-content: flex-end;
      gap: var(--space-sm);
    }

    /* Pagination */
    .pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--space-md);
      border-top: 1px solid var(--border-subtle);
    }
    .pagination-info { font-size: 0.875rem; color: var(--text-secondary); }
    .pagination-controls { display: flex; align-items: center; gap: var(--space-sm); }

    /* Responsive */
    @media (max-width: 768px) {
      .app-header { padding: var(--space-sm) var(--space-md); }
      .nav-tabs { padding: var(--space-sm) var(--space-md); }
      .main-content { padding: var(--space-md); }
      .toolbar { flex-direction: column; align-items: stretch; }
      .toolbar .search-bar { width: 100%; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .toast-container { bottom: var(--space-md); right: var(--space-md); left: var(--space-md); }
      .toast { width: 100%; }
    }

    /* Virtual Scrolling Container */
    .virtual-scroll-container { height: 600px; overflow: auto; }

    /* Keyboard Focus Styles */
    *:focus-visible { outline: 2px solid var(--accent-primary); outline-offset: 2px; }

    /* Loading Spinner */
    .spinner { width: 20px; height: 20px; border: 2px solid var(--border-default); border-top-color: var(--accent-primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Action Buttons Row */
    .action-row { display: flex; flex-wrap: wrap; gap: var(--space-sm); }

    /* Recent Scans Preview */
    .recent-scan {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      padding: var(--space-md);
      background: var(--bg-elevated);
      border-radius: var(--radius-md);
      margin-top: var(--space-md);
    }
    .recent-scan-info { flex: 1; }
    .recent-scan-gtin { font-family: var(--font-mono); font-size: 0.875rem; color: var(--text-primary); }
    .recent-scan-name { font-size: 0.75rem; color: var(--text-secondary); margin-top: var(--space-xs); }

    /* Install Prompt */
    .install-banner { display: none; padding: var(--space-md); background: linear-gradient(135deg, var(--accent-primary), var(--info)); color: white; text-align: center; }
    .install-banner.show { display: block; }

    /* Last Updated */
    .last-updated { font-size: 0.75rem; color: var(--text-muted); }
  </style>
</head>

<body>
  <div id="app">
    <!-- Install Banner -->
